<!DOCTYPE html>
<html>

<title>Dashboard</title>

<button onclick="location.href='participant.html'">My Profile</button>
<button onclick="logout()">Logout</button>

<script>

function logout(){

}


const user = localStorage.getItem("user");

if(!user){
window.location="index.html";
}

</script>
